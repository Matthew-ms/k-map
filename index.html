<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K-map</title>
  <meta name="theme-color" content="#e60012">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="K-map">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <button id="area-btn" class="float" hidden>このエリアで検索</button>
  <div id="topbar">
    <button id="filter-btn" class="float">絞り込み</button>
    <button id="me-btn" class="float" aria-label="人数と区分を変更"></button>
  </div>
  <button id="plan-btn" class="float" aria-label="プランを編集"></button>
  <button id="compare-btn" class="float"></button>
  <div id="plan-card" class="float" role="button" tabindex="0" aria-label="プランを開く" hidden></div>
  <aside id="panel" hidden aria-live="polite"></aside>
  <div id="toast" role="status" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); // installable + works offline</script>
</body>
</html>
