<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>K-map</title>
  <meta name="theme-color" content="#e60012">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="K-map">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <span class="app-name"><img src="icon.svg" alt=""><span>K-map</span></span>
    <button id="refresh-btn" class="hb">↻</button>
    <button id="filter-btn" class="hb"></button>
    <button id="me-btn" class="hb"></button>
    <button id="lang-btn" class="hb"></button>
  </header>
  <main id="map-wrap">
    <div id="map"></div>
    <button id="area-btn" hidden></button>
  </main>
  <footer id="bottombar">
    <div id="plan-card" role="button" tabindex="0"></div>
    <button id="compare-btn"></button>
  </footer>
  <aside id="panel" hidden aria-live="polite"></aside>
  <div id="toast" role="status" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); // installable + works offline</script>
</body>
</html>
