name: Weekly crawl

on:
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 Japan time (cron is UTC)
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write # commit data/
  pages: write # ask Pages to rebuild

concurrency: crawl

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Fails (and GitHub emails the repo owner) if any shop doesn't parse or validate; nothing is committed then.
      - run: npm run crawl
      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weekly data update"
          git push
          # Pushes made with GITHUB_TOKEN don't start other workflows, so request the Pages build explicitly.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
